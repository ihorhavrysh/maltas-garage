<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original illustration for Malta's Garage (MIT, same as the project). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9f5"/>
      <stop offset="1" stop-color="#e3f6fb"/>
    </linearGradient>
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="120" ry="34"/>
      <ellipse cx="-40" cy="-28" rx="60" ry="42"/>
      <ellipse cx="35" cy="-36" rx="70" ry="52"/>
    </g>
    <g id="umbrella">
      <rect x="-6" y="0" width="12" height="330" fill="#8a8f98"/>
      <path d="M-230 20 Q0 -130 230 20 Z" fill="#ffffff"/>
      <path d="M-230 20 Q-150 -75 -92 -60 L-46 20 Z M-46 20 L0 -78 L46 20 Z M92 -60 Q150 -75 230 20 L92 20 Z" fill="#f05a5a"/>
    </g>
  </defs>

  <rect width="3000" height="1000" fill="url(#sky)"/>

  <use href="#cloud" transform="translate(300 170) scale(1.3)"/>
  <use href="#cloud" transform="translate(960 250)"/>
  <use href="#cloud" transform="translate(1650 150) scale(0.8)"/>
  <use href="#cloud" transform="translate(2350 230) scale(1.1)"/>
  <use href="#cloud" transform="translate(2800 120) scale(0.7)"/>

  <!-- Skyline: limestone town with a church dome and bell towers -->
  <g fill="#a9dcec">
    <rect x="0" y="560" width="3000" height="200"/>
    <rect x="60" y="470" width="180" height="140"/>
    <rect x="260" y="430" width="140" height="180"/>
    <rect x="430" y="500" width="220" height="110"/>
    <rect x="690" y="410" width="120" height="200"/>
    <rect x="1040" y="460" width="200" height="150"/>
    <rect x="1290" y="330" width="80" height="280"/>
    <path d="M1290 330 L1330 260 L1370 330 Z"/>
    <rect x="1370" y="400" width="300" height="210"/>
    <path d="M1420 400 A100 100 0 0 1 1620 400 Z"/>
    <rect x="1508" y="250" width="24" height="60"/>
    <circle cx="1520" cy="245" r="16"/>
    <rect x="1670" y="330" width="80" height="280"/>
    <path d="M1670 330 L1710 260 L1750 330 Z"/>
    <rect x="1800" y="480" width="240" height="130"/>
    <rect x="2080" y="420" width="150" height="190"/>
    <rect x="2270" y="500" width="200" height="110"/>
    <rect x="2510" y="440" width="170" height="170"/>
    <rect x="2720" y="490" width="260" height="120"/>
  </g>
  <g fill="#92d0e3">
    <rect x="860" y="520" width="140" height="90"/>
    <rect x="95" y="510" width="30" height="40"/>
    <rect x="160" y="510" width="30" height="40"/>
    <rect x="2120" y="470" width="28" height="40"/>
    <rect x="2170" y="470" width="28" height="40"/>
    <rect x="2550" y="490" width="28" height="40"/>
    <rect x="2610" y="490" width="28" height="40"/>
    <rect x="1440" y="470" width="30" height="60"/>
    <rect x="1570" y="470" width="30" height="60"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="760" width="3000" height="240" fill="#f7dfa9"/>
  <rect x="0" y="760" width="3000" height="14" fill="#efd092"/>

  <!-- Stall 1: clothes rail and a table of crockery -->
  <use href="#umbrella" transform="translate(470 470)"/>
  <rect x="300" y="700" width="340" height="18" fill="#9b6b43"/>
  <rect x="320" y="718" width="14" height="80" fill="#7c5434"/>
  <rect x="606" y="718" width="14" height="80" fill="#7c5434"/>
  <path d="M340 700 q20 -60 50 0 Z" fill="#4aa3c9"/>
  <ellipse cx="450" cy="690" rx="46" ry="12" fill="#ffffff"/>
  <ellipse cx="450" cy="680" rx="40" ry="10" fill="#f2f2f2"/>
  <rect x="520" y="640" width="36" height="60" rx="8" fill="#f2b84b"/>
  <rect x="120" y="560" width="10" height="240" fill="#6d7480"/>
  <rect x="260" y="560" width="10" height="240" fill="#6d7480"/>
  <rect x="120" y="560" width="150" height="10" fill="#6d7480"/>
  <path d="M135 575 h40 v110 h-40 Z" fill="#5b8c5a"/>
  <path d="M185 575 h36 v130 h-36 Z" fill="#f05a5a"/>
  <path d="M228 575 h30 v95 h-30 Z" fill="#3f6fb5"/>

  <!-- Stall 2: books, a lamp and a radio -->
  <use href="#umbrella" transform="translate(1180 460) scale(0.95)"/>
  <rect x="980" y="700" width="400" height="18" fill="#9b6b43"/>
  <rect x="1000" y="718" width="14" height="80" fill="#7c5434"/>
  <rect x="1346" y="718" width="14" height="80" fill="#7c5434"/>
  <rect x="1010" y="670" width="90" height="16" fill="#3f6fb5"/>
  <rect x="1016" y="654" width="80" height="16" fill="#f05a5a"/>
  <rect x="1022" y="638" width="70" height="16" fill="#5b8c5a"/>
  <rect x="1140" y="640" width="110" height="60" rx="10" fill="#6d7480"/>
  <circle cx="1170" cy="670" r="18" fill="#3b3f46"/>
  <circle cx="1220" cy="670" r="18" fill="#3b3f46"/>
  <rect x="1300" y="600" width="8" height="100" fill="#3b3f46"/>
  <path d="M1270 600 h68 l-14 -44 h-40 Z" fill="#f2b84b"/>

  <!-- Middle ground: guitar, bicycle wheel, suitcase, vase -->
  <g transform="translate(1520 610)">
    <ellipse cx="0" cy="130" rx="48" ry="58" fill="#c98a4b"/>
    <ellipse cx="0" cy="60" rx="34" ry="40" fill="#c98a4b"/>
    <circle cx="0" cy="120" r="14" fill="#5a3a22"/>
    <rect x="-6" y="-90" width="12" height="130" fill="#5a3a22"/>
  </g>
  <g fill="none" stroke="#3b3f46" stroke-width="10">
    <circle cx="1700" cy="720" r="70"/>
    <path d="M1700 650 V790 M1630 720 H1770 M1650 670 L1750 770 M1750 670 L1650 770" stroke-width="4"/>
  </g>
  <rect x="1830" y="690" width="170" height="110" rx="12" fill="#9b6b43"/>
  <rect x="1880" y="670" width="70" height="24" rx="8" fill="none" stroke="#7c5434" stroke-width="10"/>
  <rect x="1830" y="735" width="170" height="10" fill="#7c5434"/>
  <path d="M2060 800 q-40 -60 0 -110 q-14 -20 0 -40 h40 q14 20 0 40 q40 50 0 110 Z" fill="#4aa3c9"/>

  <!-- Stall 3: toys, a clock and a television -->
  <use href="#umbrella" transform="translate(2420 470)"/>
  <rect x="2230" y="700" width="380" height="18" fill="#9b6b43"/>
  <rect x="2250" y="718" width="14" height="80" fill="#7c5434"/>
  <rect x="2576" y="718" width="14" height="80" fill="#7c5434"/>
  <rect x="2260" y="610" width="120" height="90" rx="12" fill="#6d7480"/>
  <rect x="2276" y="624" width="88" height="62" rx="6" fill="#bfe9f5"/>
  <path d="M2300 610 l20 -30 M2340 610 l-20 -30" stroke="#3b3f46" stroke-width="5"/>
  <circle cx="2450" cy="660" r="34" fill="#f2b84b"/>
  <circle cx="2426" cy="630" r="12" fill="#f2b84b"/>
  <circle cx="2474" cy="630" r="12" fill="#f2b84b"/>
  <rect x="2510" y="600" width="70" height="100" rx="8" fill="#9b6b43"/>
  <circle cx="2545" cy="640" r="24" fill="#ffffff"/>
  <path d="M2545 640 V624 M2545 640 H2558" stroke="#3b3f46" stroke-width="4"/>

  <!-- Right edge: a chair and a plant -->
  <rect x="2720" y="640" width="110" height="20" rx="6" fill="#4aa3c9"/>
  <rect x="2720" y="560" width="20" height="100" rx="6" fill="#4aa3c9"/>
  <rect x="2724" y="660" width="12" height="130" fill="#7c5434"/>
  <rect x="2812" y="660" width="12" height="130" fill="#7c5434"/>
  <rect x="2880" y="720" width="70" height="80" rx="8" fill="#c98a4b"/>
  <path d="M2915 720 q-60 -80 -20 -150 q10 70 20 150 q10 -90 50 -140 q-10 80 -50 140" fill="#5b8c5a"/>

  <!-- Rug with small items -->
  <path d="M640 900 L980 900 L1020 960 L600 960 Z" fill="#4aa3c9"/>
  <circle cx="720" cy="915" r="18" fill="#f2b84b"/>
  <rect x="780" y="895" width="60" height="40" rx="6" fill="#f05a5a"/>
  <rect x="880" y="905" width="70" height="26" rx="6" fill="#ffffff"/>
</svg>
