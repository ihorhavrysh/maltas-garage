name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR replaces the running check; on main nothing is cancelled, so a deploy
# that has started always finishes
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK version comes from global.json, the same one used locally
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Locked: exactly the package versions in packages.lock.json, nothing newer
      - name: Restore
        run: dotnet restore --locked-mode

      # Warnings fail the build, so the count stays at zero
      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      # Coverage is reported, not enforced: a summary on the run page and the Cobertura file
      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" -classfilters:"-*.Migrations.*"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # ReadyToRun keeps cold starts cheap on the App Service Free tier (60 CPU minutes a day)
      - name: Publish
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish src/MaltasGarage.Web
          --configuration Release
          --runtime linux-x64 --self-contained false
          -p:PublishReadyToRun=true
          --output ./publish

      - name: Upload app package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish
          retention-days: 7

  # Keeps the README's "docker compose up" honest: the image builds, migrates a fresh
  # SQL Server database, seeds the demo data and serves the home page
  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Home page answers
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Logs
        if: failure()
        run: docker compose logs

  deploy:
    name: Deploy to Azure App Service
    # The Docker job is the only one that migrates a real SQL Server database
    needs: [build-test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEMO_URL }}
    permissions:
      id-token: write   # OpenID Connect: no long-lived Azure credentials in the repository
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      # robots.txt needs no database, so this checks that the app itself started;
      # the free tier can take a while to cold start
      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.DEMO_URL }}/robots.txt" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "The app did not answer with 200 after deployment"
          exit 1
