name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # ReadyToRun keeps cold starts cheap on the App Service Free tier (60 CPU minutes a day)
      - name: Publish
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish src/MaltasGarage.Web
          --configuration Release
          --runtime linux-x64 --self-contained false
          -p:PublishReadyToRun=true
          --output ./publish

      - name: Upload app package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEMO_URL }}
    permissions:
      id-token: write   # OpenID Connect: no long-lived Azure credentials in the repository
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      # robots.txt needs no database, so this checks that the app itself started;
      # the free tier can take a while to cold start
      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.DEMO_URL }}/robots.txt" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "The app did not answer with 200 after deployment"
          exit 1
